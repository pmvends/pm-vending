name: Deploy to GitHub Pages

on:
  push:
    # The local branch is master, but GitHub defaults new repos to main.
    # Accepting both avoids a silent no-deploy if the branch is ever renamed.
    branches: [main, master]
  workflow_dispatch:

# Allow a single deployment at a time; queued runs are superseded, not stacked.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches the version used locally, so CI cannot pass on a runtime the
      # site was never developed against.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
